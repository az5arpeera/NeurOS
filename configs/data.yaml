# Data-layer config (architecture §4). Relative paths resolve against this file's directory.
# The values below are the signed-off contract (D-022); experiments override them only through
# their own config files, and every result records the config hash.
data_dir: ../data
cache_dir: ../cache
results_dir: ../results

signal:
  sfreq: 128.0
  band_hz: [4.0, 30.0]
  filter_order: 4
  notch_hz: [50.0, 60.0]
  notch_q: 30.0
  window_s: 2.0
  hop_s: 0.125
  epoch_s: [0.5, 2.5]
  reference: car

validation:
  flat_std_uv: 0.1
  ptp_flag_uv: 500.0
  amplitude_mad_uv: [0.5, 200.0]
  window_s: 2.0
