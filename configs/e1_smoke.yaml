# E1 smoke test: the whole E1 pipeline (loading, layout, folds, every condition, the cue-only
# control, the report) on the datasets already on the laptop. Not a result: a pipeline check
# before AWS.
#   uv run neuros --config configs/data.yaml e1 --experiment configs/e1_smoke.yaml \
#     --max-subjects 6 --max-epochs 3
name: e1_smoke
description: E1 pipeline check on PhysionetMI + BNCI2014-001 (+ BNCI2014-004 test-only).
train_datasets: [PhysionetMI, BNCI2014_001]
test_only_datasets: [BNCI2014_004]
labels: [left_hand, right_hand]
channels: motor
reference: car
alignment: ea
alignment_unit: session
conditions: [pooled, single, lodo, cue_only]
folds: 3
validation_fraction: 0.2
seeds: [20261005]
signal:
  band_hz: [8.0, 30.0]
train:
  max_epochs: 3
  people_per_batch: 4
  windows_per_person: 8
  log_every: 1
