# E2 smoke test: the whole E2 pipeline (warm-up sets from cached recordings, pooled models
# scoring them, the summary) on datasets the laptop already has. Not a result: a pipeline check.
#   uv run neuros --config configs/data.yaml e1 --experiment configs/e2_smoke.yaml \
#     --max-subjects 6 --max-epochs 3
name: e2_smoke
description: E2 pipeline check on PhysionetMI + BNCI2014-001 (warm-up on BNCI2014-001).
train_datasets: [PhysionetMI, BNCI2014_001]
test_only_datasets: [BNCI2014_004]
labels: [left_hand, right_hand]
channels: motor
reference: car
alignment: ea
alignment_unit: session
conditions: [pooled]
folds: 3
validation_fraction: 0.2
seeds: [20261005]
signal:
  band_hz: [8.0, 30.0]
train:
  max_epochs: 3
  people_per_batch: 4
  windows_per_person: 8
  log_every: 1
warmup:
  datasets: [BNCI2014_001]
  budgets_s: [0, 10, 60, 120]
