# E0 with the literature's window: [cue, cue + 4 s] (MOABB's default for BNCI2014-001), instead
# of our 2-s product window. Everything else is as in e0.yaml.
#
# Why: longer windows carry more motor-imagery signal, so a 2-s result is expected to be lower
# than the paper's 74.3 %. If e0 (2 s) falls short but this run is within ±3 points of the
# paper, the pipeline is fine and the gap is the window, a protocol difference we chose.
#
# Regenerate: uv run neuros --config configs/data.yaml loso --experiment configs/e0_window4s.yaml
name: e0_window4s
description: >
  E0 with the paper's 4-s window [cue, cue + 4 s] (512 samples at 128 Hz); EEGNet + EA only.
dataset: BNCI2014_001
labels: [left_hand, right_hand]
channels: all
reference: as_recorded
alignments: [ea]
alignment_unit: session
seeds: [20261005]
validation_people: 0

signal:                  # overrides of configs/data.yaml for this experiment only
  window_s: 4.0
  epoch_s: [0.0, 4.0]

model:
  f1: 16
  depth: 2
  f2: 32
  kernel_samples: 64
  dropout: 0.5
  embedding_dim: 64
  spatial_max_norm: 1.0
  head_max_norm: 0.25

train:
  max_epochs: 300
  lr: 0.001
  min_lr: 0.0
  weight_decay: 0.05
  label_smoothing: 0.0
  swa_fraction: 0.25
  patience: null
  people_per_batch: 8
  windows_per_person: 8
  log_every: 50
