# D-039 smoke test: E2's pipeline with training crops and extra classes (training windows
# and warm-up sets from cached recordings, pooled models scoring them, the summary) on
# datasets the laptop already has. Not a result: a pipeline check.
#   uv run neuros --config configs/data.yaml e1 \
#     --experiment configs/e2_training_windows_smoke.yaml --max-subjects 6 --max-epochs 3
name: e2_training_windows_smoke
description: D-039 pipeline check on PhysionetMI + BNCI2014-001 (crops, extra classes, warm-up).
train_datasets: [PhysionetMI, BNCI2014_001]
test_only_datasets: [BNCI2014_004]
labels: [left_hand, right_hand]
channels: motor
reference: car
alignment: ea
alignment_unit: session
conditions: [pooled]
folds: 3
validation_fraction: 0.2
seeds: [20261005]
signal:
  band_hz: [8.0, 30.0]
train:
  max_epochs: 3
  people_per_batch: 4
  windows_per_person: 8
  log_every: 1
warmup:
  datasets: [BNCI2014_001]
  budgets_s: [0, 10, 60, 120]
training_windows:
  crop_stride_s: 0.5
  extra_labels: [feet, tongue, both_hands, rest]
