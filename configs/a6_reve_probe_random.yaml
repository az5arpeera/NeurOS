# A6 port check (plan: 'Port check'): REVE with its encoder frozen for every epoch (a linear
# probe), RANDOM weights (the control). Run with --max-subjects 10 on AWS; compare validation accuracy.
name: a6_reve_probe_random
description: >
  A6: REVE-base (pretrained on 60,000 h from 25,000 people; REVE Responsible Use License)
  fine-tuned on E2's folds, scored like E2 after 120 s of unlabeled streaming, plus the E5
  channel sets.
train_datasets: [PhysionetMI, Dreyer2023, Stieger2021, Lee2019_MI, Cho2017, Yang2025, BNCI2014_001]
test_only_datasets: [Shin2017A, GuttmannFlury2025, BNCI2014_004]
labels: [left_hand, right_hand]
channels: motor
reference: car
alignment: ea
alignment_unit: session
conditions: [pooled]
folds: 5
validation_fraction: 0.1
cue_only_epoch_s: [0.0, 0.5]
seeds: [20261005]
signal:
  band_hz: [8.0, 30.0]

backbone:
  name: reve-base
  weights: null  # random weights: the control
  dropout: 0.5

train:
  max_epochs: 4
  lr: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  swa_fraction: 0.25
  patience: 4
  people_per_batch: 16
  windows_per_person: 8
  log_every: 1
  backbone_lr_scale: 0.1
  frozen_backbone_epochs: 4

warmup:
  datasets: [Yang2025, BNCI2014_001, Shin2017A]
  budgets_s: [0, 120]
  rest_seeded: false
