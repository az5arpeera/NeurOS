# D-039, "use more of what we have": E2 with training crops every 0.5 s and the extra
# classes together.
#   - Everything else is E2's: data, layout, recipe, seed, folds, and the warm-up sets the
#     pooled models are scored on. Validation and test windows are unchanged (left vs
#     right, the D-030 window, E1's alignment); only what the models train on differs.
#   - Compare person by person with E2's pooled and warm-up scores (same seed and folds).
#
# On AWS:
#   uv run --no-sync neuros --config configs/data.yaml e1 \
#     --experiment configs/e2_crops_multiclass.yaml --device cuda --workers 4 --threads 2
name: e2_crops_multiclass
description: >
  E2's pooled EEGNet + EA models trained with training crops and the extra classes
  (D-039), scored on E2's left/right test windows and warm-up sets.
train_datasets: [PhysionetMI, Dreyer2023, Stieger2021, Lee2019_MI, Cho2017, Yang2025, BNCI2014_001]
test_only_datasets: [Shin2017A, GuttmannFlury2025, BNCI2014_004]
labels: [left_hand, right_hand]
channels: motor
reference: car
alignment: ea
alignment_unit: session
conditions: [pooled]       # cue-only control: E2's, unchanged (same windows, E1 recipe)
folds: 5
validation_fraction: 0.1
cue_only_epoch_s: [0.0, 0.5]
seeds: [20261005]
signal:
  band_hz: [8.0, 30.0]

model:
  dropout: 0.25

train:
  max_epochs: 100
  lr: 0.001
  weight_decay: 0.05
  label_smoothing: 0.1
  swa_fraction: 0.25
  patience: 15
  people_per_batch: 16
  windows_per_person: 8
  log_every: 10

warmup:
  datasets: [Yang2025, BNCI2014_001, Shin2017A]   # cue-free: the headline is cue-controlled
  budgets_s: [0, 5, 10, 20, 30, 45, 60, 120]
  prior_s: 10.0          # n0 (§5): the prior weighs as much as 10 s of the user's data
  stream_window_s: 2.0   # the decoder's window
  stream_hop_s: 0.125    # the contract's hop
  rest_seeded: true      # H1

training_windows:        # D-039
  crop_stride_s: 0.5
  extra_labels: [feet, tongue, both_hands, rest]
