# Lint, types and unit tests on CPU with synthetic data (architecture §9). No dataset downloads:
# tests marked `data` are skipped here. PyTorch (the `ml` extra) installs from PyTorch's CPU-only
# index on Linux (pyproject [tool.uv.sources]): ~196 MB instead of ~3.3 GB of CUDA wheels.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --extra dev --extra ml --locked
      - name: Format
        run: uv run ruff format --check src tests infra
      - name: Lint
        run: uv run ruff check src tests infra
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
        env:
          HYPOTHESIS_PROFILE: ci
