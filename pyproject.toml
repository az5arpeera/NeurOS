# NeurOS: zero-calibration intent layer for EEG brain-computer interfaces.
# Architecture and coding guidelines: knowledge-base/architecture/mvp-architecture.md

[project]
name = "neuros"
version = "0.1.0.dev0"
description = "Zero-calibration intent layer for EEG brain-computer interfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NeurOS founders" }]
# Core runtime dependencies: permissive licences only (architecture §9).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "mne>=1.7",
    "moabb>=1.1",
    "pyriemann>=0.12",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Model layer (encoder, heads, training, test-time adaptation). Needed from Day 3 (E0).
# Install with `uv sync --extra dev --extra ml`. On Linux it comes from PyTorch's CPU-only
# index (see [tool.uv.sources] below).
ml = ["torch>=2.4"]
# The same model layer on NVIDIA GPUs (AWS, D-032): Linux wheels built against CUDA 12.6, from
# PyTorch's cu126 index (NVIDIA driver >= 525). On the GPU machine:
# `uv sync --extra dev --extra ml-cuda`. Mutually exclusive with `ml` ([tool.uv] conflicts).
ml-cuda = ["torch>=2.4"]
# Online engine (LSL in, WebSocket out). Needed from week 2. BrainFlow only on Python 3.12+:
# on 3.11 it loads its native library through pkg_resources, which setuptools removed in v82
# (`neuros.engine.sources.brainflow_api` says so; LSL works on 3.11).
engine = ["pylsl>=1.16", "brainflow>=5.12; python_version >= '3.12'", "websockets>=12"]
# Building text anchors offline for the text-anchored head (D-023). Never imported at runtime.
anchors = ["sentence-transformers>=3"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
neuros = "neuros.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------- package sources
# PyTorch on Linux comes from PyTorch's own indexes:
# - `ml`: the CPU-only build. PyPI's Linux wheel is ~555 MB and pulls ~2.75 GB of NVIDIA CUDA
#   libraries that CI never uses; the CPU build has the same API and numerics on CPU.
# - `ml-cuda`: the CUDA 12.6 build for GPU training on AWS (D-032). cu126 rather than cu130:
#   it runs on older drivers (>= 525 instead of >= 580), and every AWS GPU we'd rent (A10G,
#   L4, L40S, A100, H100) supports it.
# Windows and macOS wheels on PyPI are CPU-only, so they stay on PyPI. `explicit = true`:
# nothing but torch is ever resolved from these indexes.
[tool.uv]
conflicts = [[{ extra = "ml" }, { extra = "ml-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra = "ml" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'", extra = "ml-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/neuros"]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "SIM",      # simplifications
    "C4",       # comprehensions
    "NPY",      # numpy-specific rules
    "PT",       # pytest style
    "RUF",      # ruff-specific rules
]
ignore = [
    # Math code names matrices the way the papers do (X, C, R_bar, U). Readability of the
    # equations beats PEP 8 here; see architecture §5.
    "N803", "N806",
    # `import torch.nn.functional as F` is PyTorch's universal convention.
    "N812",
    # Docstrings and comments use µ, γ, ±, × on purpose (units and math).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/neuros"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party scientific packages without complete type stubs.
module = [
    "mne.*", "moabb.*", "pyriemann.*", "scipy.*", "pyarrow.*", "pandas.*", "sklearn.*",
    "threadpoolctl",  # installed by scikit-learn; caps BLAS threads in baseline fold workers
    "pylsl", "pylsl.*", "brainflow.*",  # the engine extra (live headset sources)
]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs downloaded datasets (run with NEUROS_DATA_TESTS=1)",
    "slow: slow tests",
]
filterwarnings = [
    # MNE/MOABB emit deprecation noise from their own dependencies; our code must stay clean.
    "ignore::DeprecationWarning:mne.*",
    "ignore::DeprecationWarning:moabb.*",
    # MOABB 1.7 requests the "standard_1005" montage that MNE 1.13 deprecates (MOABB-internal).
    "ignore:Montage name .standard_1005. is deprecated:FutureWarning",
]
