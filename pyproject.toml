# NeurOS: zero-calibration intent layer for EEG brain-computer interfaces.
# Architecture and coding guidelines: knowledge-base/architecture/mvp-architecture.md

[project]
name = "neuros"
version = "0.1.0.dev0"
description = "Zero-calibration intent layer for EEG brain-computer interfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NeurOS founders" }]
# Core runtime dependencies: permissive licences only (architecture §9).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "mne>=1.7",
    "moabb>=1.1",
    "pyriemann>=0.6",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Model layer (encoder, heads, training, test-time adaptation). Needed from week 1, Mon 5 Oct.
ml = ["torch>=2.4"]
# Online engine (LSL in, WebSocket out). Needed from week 2.
engine = ["pylsl>=1.16", "brainflow>=5.12", "websockets>=12"]
# Building text anchors offline for the text-anchored head (D-023). Never imported at runtime.
anchors = ["sentence-transformers>=3"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
neuros = "neuros.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuros"]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "SIM",      # simplifications
    "C4",       # comprehensions
    "NPY",      # numpy-specific rules
    "PT",       # pytest style
    "RUF",      # ruff-specific rules
]
ignore = [
    # Math code names matrices the way the papers do (X, C, R_bar, U). Readability of the
    # equations beats PEP 8 here; see architecture §5.
    "N803", "N806",
    # Docstrings and comments use µ, γ, ±, × on purpose (units and math).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/neuros"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party scientific packages without complete type stubs.
module = ["mne.*", "moabb.*", "pyriemann.*", "scipy.*", "pyarrow.*", "pandas.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs downloaded datasets (run with NEUROS_DATA_TESTS=1)",
    "slow: slow tests",
]
filterwarnings = [
    # MNE/MOABB emit deprecation noise from their own dependencies; our code must stay clean.
    "ignore::DeprecationWarning:mne.*",
    "ignore::DeprecationWarning:moabb.*",
]
